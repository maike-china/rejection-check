name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: 使用 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 安装依赖
        run: npm install

      - name: 检查插件入口语法
        run: |
          node --check index.js
          node --check scripts/parse.mjs
          node --check scripts/report.mjs

      - name: 校验 bundle manifest 与 patch 层
        run: |
          node -e "
            const p = require('./package.json');
            if (!p.dsh || !p.dsh.bundle || !p.dsh.bundle.patch) {
              console.error('缺少 dsh.bundle.patch 声明');
              process.exit(1);
            }
            if (p.type !== 'module') {
              console.error('插件必须为 ESM（type: module）');
              process.exit(1);
            }
            const fs = require('node:fs');
            if (!fs.existsSync(p.dsh.bundle.patch)) {
              console.error('cordis.patch.yml 不存在');
              process.exit(1);
            }
            if (!fs.existsSync(p.main || 'index.js')) {
              console.error('main 入口不存在');
              process.exit(1);
            }
            console.log('bundle manifest ✓ (' + p.name + ' → ' + p.dsh.bundle.patch + ')');
          "

      - name: 测试插件入口可加载
        run: |
          node -e "
            import('./index.js').then((m) => {
              if (typeof m.apply !== 'function') { console.error('缺少 apply()'); process.exit(1); }
              console.log('index.js 可加载 ✓ (name=' + m.name + ', inject=' + JSON.stringify(m.inject) + ')');
            });
          "

      - name: 测试文档解析（docx）
        run: |
          echo "测试解析器可用性..."
          node -e "
            const m = require('mammoth');
            console.log('mammoth 可用 ✓');
          "

      - name: 测试报告生成模块
        run: |
          node --input-type=module -e "
            const { buildHtml, buildMarkdown } = await import('./scripts/report.mjs');
            const meta = { title: '测试报告', generatedAt: '2026-01-01', tender: '招标文件', bids: '投标文件' };
            const results = { rejection: [], typo: [], logic: [] };
            const html = buildHtml(meta, results);
            const md = buildMarkdown(meta, results);
            console.log('HTML 生成 ✓ (' + html.length + ' 字符)');
            console.log('Markdown 生成 ✓ (' + md.length + ' 字符)');
          "
